<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover"
    />

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self' capacitor: ionic: https://localhost;
      script-src 'self' capacitor: ionic: https://localhost https://cdn.gpteng.co https://cdn.tailwindcss.com 'unsafe-inline';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' data: https://fonts.gstatic.com;
      img-src 'self' data: blob: https: capacitor: ionic:;
      connect-src 'self' capacitor: ionic: https://localhost https://*.supabase.co https://ai.gateway.lovable.dev https://world.openfoodfacts.org https://*.lovableproject.com https://*.lovable.app wss://*.supabase.co;
      base-uri 'self';
      base-uri 'self';
      form-action 'self';
      object-src 'none';
    " />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />

    <title>NutriTrack - Track Your Nutrition</title>
    <meta name="description" content="Track calories, macros and 40+ micronutrients with barcode scanning, AI food lookup and offline logging." />
    <meta name="author" content="NutriTrack" />

    <!-- Mobile / installable app -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#141614" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="NutriTrack" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" href="/favicon.png" type="image/png" />

    <meta property="og:title" content="NutriTrack - Track Your Nutrition" />
    <meta property="og:description" content="Track calories, macros and 40+ micronutrients with barcode scanning, AI food lookup and offline logging." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
